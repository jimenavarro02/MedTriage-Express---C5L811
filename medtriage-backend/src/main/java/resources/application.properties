spring.datasource.url=jdbc:h2:mem:medtriagedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Desactivar auto-ddl de Hibernate para evitar conflictos con schema.sql (según rúbrica)[cite: 7]
spring.jpa.hibernate.ddl-auto=none

# H2 Console y activacion de inicializacion SQL automática[cite: 7]
spring.h2.console.enabled=true
spring.sql.init.mode=always